[package]
name = "geopq-workbench"
default-run = "geopq-workbench"
version = "0.9.1"
edition = "2024"
description = "GeoPQ Workbench: a fast native technical workbench for GeoParquet data"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gsueur/geopq-workbench"
readme = "README.md"

[dependencies]
arrow = "58.3.0"
base64 = "0.22.1"
bytemuck = "1.25.1"
bytes = "1.12"
crs-definitions = "0.5.0"
datafusion = { version = "54.0.0", default-features = false, features = ["sql", "nested_expressions", "string_expressions", "unicode_expressions", "datetime_expressions", "math_expressions", "regex_expressions"] }
eframe = { version = "0.35.0", features = ["wgpu"] }
env_logger = "0.11.11"
geo = "0.33.1"
geo-types = "0.7.19"
geo-traits = "0.3"
flate2 = "1"
image = "0.25.10"
log = "0.4.33"
lyon = "1.0.19"
parquet = { version = "58.3.0", features = ["arrow", "snap", "zstd", "lz4", "brotli", "flate2", "geospatial"] }
parquet-geospatial = "58.3.0"
proj4rs = { version = "0.1.10", features = ["esri", "krovak"] }
rfd = "0.17.2"
rstar = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = "3.3.0"
wkb = "0.9.2"
wgpu = "29"
egui_extras = "0.35.0"
rayon = "1.12.0"
rusty-s3 = "0.10.0"
wkt = "0.14"
# rt-multi-thread: SQL queries plan `num_cpus` partitions, each served
# by a blocking parquet reader — a current-thread runtime interleaved them
# on one core.
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread"] }
async-trait = "0.1.89"
futures = "0.3.32"
h3o = { version = "0.10.0", features = ["geo"] }
rusqlite = { version = "0.37", features = ["bundled"] }
shapefile = { version = "0.9.0", features = ["geo-types", "yore", "encoding_rs"] }
egui-phosphor = "0.13.0"
proj4wkt = "0.1.1"
a5 = "0.9.0"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
pollster = "1.0.1"

# Debug binaries were ~10x slower to load data (70 s vs 7 s for a 1.9M-row
# parcels file), which reads as an app regression when it is just an
# unoptimized build. Optimize code in dev while keeping debug assertions.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Distribution builds: thin LTO buys a smaller, slightly faster binary for
# a modest compile-time cost; stripping drops the ~10x debug-symbol bloat.
[profile.release]
lto = "thin"
strip = true
